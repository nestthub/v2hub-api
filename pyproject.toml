[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "v2hub-api"
version = "1.0.3"
description = "API backend for V2Hub subscription management"
readme = "README.md"
license = { text = "MIT" }

authors = [
    { name = "nestt", email = "nestt@tutamail.com" }
]

requires-python = ">=3.11"

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: FastAPI",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

keywords = [
    "v2hub",
    "api",
    "fastapi",
    "subscription",
    "vpn",
]

dependencies = [
    "aiohttp>=3.13.5,<4.0",
    "alembic>=1.18.4,<2.0",
    "asyncpg>=0.31.0,<1.0",
    "fastapi>=0.136.0,<1.0",
    "httpx>=0.28.1,<1.0",
    "mypy>=2.3.0",
    "prometheus-client>=0.25.0,<1.0",
    "pydantic>=2.13.3,<3.0",
    "pydantic-settings>=2.14.0,<3.0",
    "redis[hiredis]>=7.4.0,<8.0",
    "celery>=5.4.0",
    "ruff>=0.16.0",
    "scalar-fastapi>=1.8.2,<2.0",
    "sqlalchemy[asyncio]>=2.0.49,<3.0",
    "uvicorn[standard]>=0.45.0,<1.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.5.0",
    "pre-commit>=3.4.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "ruff>=0.1.0",
    "aiosqlite>=0.22.1",
]

[project.urls]
Homepage = "https://github.com/nestthub/v2hub-api"
Documentation = "https://github.com/nestthub/v2hub-api#readme"
Repository = "https://github.com/nestthub/v2hub-api"
Issues = "https://github.com/nestthub/v2hub-api/issues"


[tool.hatch.build.targets.wheel]
packages = ["src/v2hub_api"]


[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]


[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "ARG",
    "SIM",
    "TCH",
    "PTH",
    "RUF",
]

ignore = [
    "E722",
    "E501",
    "B008",
    "ARG002",
    "RUF001",
    "RUF002",
    "RUF003",
]


[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401",
    "F403",
]

"tests/*" = [
    "ARG001",
    "ARG002",
]


[tool.ruff.lint.isort]
known-first-party = [
    "v2hub_api",
]


[tool.mypy]
python_version = "3.11"

strict = true
warn_return_any = true
warn_unused_configs = true

disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

no_implicit_optional = true

warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

strict_equality = true

plugins = [
    "pydantic.mypy",
]


[tool.pytest.ini_options]
testpaths = [
    "tests",
]

asyncio_mode = "auto"

addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]

markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]


[tool.coverage.run]
source = [
    "v2hub_api",
]

omit = [
    "*/tests/*",
]


[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
    "@overload",
]
