limit_req_zone $limit_key zone=general:10m rate=15r/s;
limit_req_zone $limit_key zone=api:10m rate=100r/s;
limit_req_zone $limit_key zone=sub:10m rate=10r/s;
limit_req_zone $limit_key zone=admin:10m rate=3r/s;

limit_conn_zone $limit_key zone=conn:10m;

map $remote_addr $limit_key {
    default         $binary_remote_addr;
    1.1.1.1  "";
}

upstream api_backend {
    server api:8000;
    keepalive 64;
}

server {
    listen 80;
    server_name v2hub.link www.v2hub.link;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name v2hub.link www.v2hub.link;

    ssl_certificate /etc/letsencrypt/live/v2hub.link/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/v2hub.link/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_stapling on;
    ssl_stapling_verify on;

    server_tokens off;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    limit_conn conn 20;
    client_max_body_size 5m;
    client_body_timeout 20s;
    client_header_timeout 20s;
    keepalive_timeout 30s;

    location /api/v1/admin/ {
        limit_req zone=admin burst=5 nodelay;
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /sub/ {
        limit_req zone=sub burst=20 nodelay;
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        access_log off;
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=general burst=100 nodelay;
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /metrics {
        deny all;
    }

    location /grafana/ {
        auth_basic           "Monitoring";
        auth_basic_user_file /etc/nginx/grafana.htpasswd;


        proxy_pass          http://grafana:3000;
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_redirect      http://grafana:3000/ /grafana/;
    }

    location ~* /\.(env|git|sql|bak|swp|old)$ {
        deny all;
    }
}
