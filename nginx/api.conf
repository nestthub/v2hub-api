# ═══════════════════════════════════════
# RATE LIMITING (adjusted)
# ═══════════════════════════════════════

# general — редкий трафик (301 редирект), можно держать мягко
limit_req_zone $binary_remote_addr zone=general:10m rate=15r/s;

# API — основной трафик, полагаемся на backend throttling
limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;

# subscriptions
limit_req_zone $binary_remote_addr zone=sub:10m rate=10r/s;

# admin — чуть увеличен, но всё ещё защищён
limit_req_zone $binary_remote_addr zone=admin:10m rate=3r/s;

# connections (без изменений)
limit_conn_zone $binary_remote_addr zone=conn:10m;

# ═══════════════════════════════════════
# SSL (unchanged but clean)
# ═══════════════════════════════════════

ssl_session_cache shared:SSL:10m;
ssl_session_timeout 10m;

ssl_protocols TLSv1.2 TLSv1.3;

ssl_ciphers HIGH:!aNULL:!MD5;
ssl_prefer_server_ciphers on;

ssl_stapling on;
ssl_stapling_verify on;

resolver 1.1.1.1 8.8.8.8;

# ═══════════════════════════════════════
# UPSTREAM
# ═══════════════════════════════════════

upstream api_backend {
    server api:8000;
    keepalive 64;
}

# ═══════════════════════════════════════
# HTTP -> HTTPS
# ═══════════════════════════════════════

server {
    listen 80;
    server_name api.yourdomain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ═══════════════════════════════════════
# MAIN SERVER
# ═══════════════════════════════════════

server {
    listen 443 ssl http2;
    server_name api.yourdomain.com;

    ssl_certificate /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;

    server_tokens off;

    # security headers (light version)
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # limits
    limit_conn conn 20;
    client_max_body_size 5m;

    client_body_timeout 20s;
    client_header_timeout 20s;
    keepalive_timeout 30s;

    # ═══════════════════════════════════
    # ADMIN (protected but usable)
    # ═══════════════════════════════════

    location /api/v1/admin/ {
        limit_req zone=admin burst=5 nodelay;

        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ═══════════════════════════════════
    # PUBLIC SUBSCRIPTIONS
    # ═══════════════════════════════════

    location /sub/ {
        limit_req zone=sub burst=20 nodelay;

        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ═══════════════════════════════════
    # API
    # ═══════════════════════════════════

    location /api/ {
        limit_req zone=api burst=40 nodelay;

        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ═══════════════════════════════════
    # ROOT / GENERAL
    # ═══════════════════════════════════

    location / {
        limit_req zone=general burst=100 nodelay;

        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ═══════════════════════════════════
    # BLOCK SENSITIVE FILES
    # ═══════════════════════════════════

    location ~* /\.(env|git|sql|bak|swp|old)$ {
        deny all;
    }

    # ═══════════════════════════════════
    # HEALTH
    # ═══════════════════════════════════

    location /health {
        access_log off;
        proxy_pass http://api_backend;
    }
}
