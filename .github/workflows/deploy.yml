name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    steps:
      - name: Guard against missing secrets
        run: |
          missing=0
          for var in HOST PORT USER SSH_KEY; do
            if [ -z "${!var}" ]; then
              echo "Missing required secret: $var"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            exit 1
          fi
        env:
          HOST: ${{ secrets.HOST }}
          PORT: ${{ secrets.PORT }}
          USER: ${{ secrets.USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
      - name: Resolve commit to deploy
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            sha="${{ github.sha }}"
          else
            sha="${{ github.event.workflow_run.head_sha }}"
          fi
          if [ -z "$sha" ]; then
            echo "Could not resolve a commit SHA to deploy"
            exit 1
          fi
          echo "Deploying commit: $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Add server to known_hosts
        run: |
          ssh-keyscan -p "${{ secrets.PORT }}" -H "${{ secrets.HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy, migrate, and verify health (single SSH session)
        env:
          DEPLOY_SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.PORT }}" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o BatchMode=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            "${{ secrets.USER }}@${{ secrets.HOST }}" \
            "DEPLOY_SHA='${DEPLOY_SHA}' bash -s" <<'EOF'
          set -euo pipefail
          set -x

          cd ~/v2hub-api

          echo "=== Fetching commit ${DEPLOY_SHA} ==="
          git fetch origin "${DEPLOY_SHA}" < /dev/null
          git checkout --force "${DEPLOY_SHA}" < /dev/null
          echo "=== Now at commit: $(git rev-parse HEAD) ==="

          echo "=== Pulling prebuilt images if available ==="
          docker compose pull < /dev/null || true

          echo "=== Building images ==="
          docker compose build < /dev/null

          echo "=== Starting database ==="
          docker compose up -d postgres < /dev/null

          echo "=== Waiting for database ==="
          db_ready=0
          for i in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready < /dev/null; then
              echo "Database is ready."
              db_ready=1
              break
            fi
            sleep 2
          done

          if [ "$db_ready" -ne 1 ]; then
            echo "ERROR: Database did not become ready."
            docker compose logs --tail=200 postgres
            exit 1
          fi

          echo "=== Running database migrations ==="
          docker compose run --rm --no-deps api alembic upgrade head < /dev/null

          echo "=== Starting application ==="
          docker compose up -d --force-recreate < /dev/null

          echo "=== Checking api directly (bypassing nginx) before restarting nginx ==="
          api_ready=0
          attempts=30
          delay=2
          for i in $(seq 1 "$attempts"); do
            status=$(docker compose exec -T api python -c "import urllib.request as u; print(u.urlopen('http://localhost:8000/health', timeout=3).status)" < /dev/null 2>/dev/null || echo "000")
            echo "Attempt $i/$attempts: api direct health = $status"
            if [ "$status" = "200" ]; then
              api_ready=1
              break
            fi
            sleep "$delay"
          done

          if [ "$api_ready" -ne 1 ]; then
            echo "ERROR: api never became ready directly, aborting before nginx restart to avoid downtime."
            docker compose logs --tail=200 api
            exit 1
          fi

          echo "api is directly reachable, proceeding to restart nginx."
          echo "=== Restarting nginx to refresh upstream DNS resolution ==="
          docker compose restart nginx < /dev/null

          echo "=== Verifying /health through nginx (same session, same deployed commit) ==="
          attempts=30
          delay=5
          success=0
          for i in $(seq 1 "$attempts"); do
            status=$(curl -sk -o /dev/null -w "%{http_code}" -L https://localhost/health < /dev/null || echo "000")
            echo "Attempt $i/$attempts: HTTP $status"
            if [ "$status" = "200" ]; then
              success=1
              break
            fi
            sleep "$delay"
          done

          if [ "$success" -ne 1 ]; then
            echo "ERROR: /health via nginx did not return 200 after $attempts attempts."
            echo "----- docker compose ps -----"
            docker compose ps < /dev/null
            echo "----- docker compose logs (last 200 lines) -----"
            docker compose logs --tail=200 < /dev/null
            exit 1
          fi

          echo "=== Verifying the running commit matches the deployed commit ==="
          running_sha="$(git rev-parse HEAD < /dev/null)"
          if [ "$running_sha" != "${DEPLOY_SHA}" ]; then
            echo "ERROR: running commit ($running_sha) does not match target commit (${DEPLOY_SHA})"
            exit 1
          fi

          echo "=== Cleaning up dangling images and build cache ==="
          docker image prune -f < /dev/null
          docker builder prune -f < /dev/null

          echo "=== DEPLOY SCRIPT COMPLETED SUCCESSFULLY: commit ${DEPLOY_SHA} is live and /health returned HTTP 200 ==="
          EOF

      - name: Clean up local SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
