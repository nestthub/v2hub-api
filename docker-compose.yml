x-app-build: &app-build
  build:
    context: .
    dockerfile: Dockerfile
  env_file: .env
  environment:
    PYTHONPATH: /app
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  api:
    <<: *app-build
    restart: unless-stopped
    command: >
      uvicorn v2hub_api.main:app
      --host 0.0.0.0
      --port 8000
      --proxy-headers
      --forwarded-allow-ips="*"
    expose:
      - "8000"
    networks:
      - backend
      - frontend
      - monitoring

  worker:
    <<: *app-build
    command: >
      celery -A worker.celery_app worker
      --loglevel=info
      --concurrency=3
      --queues=celery
    restart: unless-stopped
    networks:
      - backend
      - frontend

  beat:
    <<: *app-build
    command: >
      celery -A worker.celery_app beat
      --loglevel=info
      --schedule=/app/celerybeat/schedule.db
    volumes:
      - celerybeat_data:/app/celerybeat
    restart: unless-stopped
    networks:
      - backend

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: v2hub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d v2hub"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - backend

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - backend

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Consumed by nginx's built-in envsubst-on-templates entrypoint
      # (renders nginx/conf.d.templates/*.template -> /etc/nginx/conf.d/*.conf
      # on container start). Values come from .env — see .env.example.
      DOMAIN: ${DOMAIN}
      # Comma-separated list of IPs exempt from rate limiting, e.g.
      # "1.1.1.1,2.2.2.2". Turned into a proper nginx `map` block by
      # nginx/entrypoint/10-generate-limit-key-map.sh at container start.
      TRUSTED_NOLIMIT_IPS: ${TRUSTED_NOLIMIT_IPS:-}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/entrypoint/10-generate-limit-key-map.sh:/docker-entrypoint.d/10-generate-limit-key-map.sh:ro
      - ./nginx/grafana.htpasswd:/etc/nginx/grafana.htpasswd:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    restart: unless-stopped
    networks:
      - frontend
      - monitoring

  certbot-renew:
    build: ./certbot-renew
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: /bin/sh
    command: -c "while true; do certbot renew --webroot -w /var/www/certbot --quiet --deploy-hook 'docker exec nginx nginx -s reload'; sleep 12h; done"
    restart: unless-stopped
    networks:
      - frontend

